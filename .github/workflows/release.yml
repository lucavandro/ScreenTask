name: Publish GitHub Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and publish (for example v2.1.0)"
        required: true
        type: string
        default: "v2.1.0"

permissions:
  contents: write

jobs:
  release:
    name: Build, Verify & Publish Release (.NET 9.0)
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Validate release tag and source version
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Use an existing MAJOR.MINOR.PATCH release tag, for example v2.1.0."
          }
          [xml]$project = Get-Content ScreenTask/ScreenTask.csproj -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          if ($tag -ne "v$version") {
            throw "Release tag $tag does not match source version $version."
          }

      - name: Setup .NET 9.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Prepare portable WebRTC runtime
        shell: pwsh
        run: ./scripts/Prepare-WebRtcRuntime.ps1

      - name: Verify JavaScript syntax (Web Viewer)
        run: |
          node -c ScreenTask/WebServer/viewer.js
          node --test ScreenTask.Tests/Web/viewer-decoder.test.cjs ScreenTask.Tests/Web/viewer-webrtc.test.cjs ScreenTask.Tests/Web/viewer-fullscreen.test.cjs

      - name: Build & Run Automated Test Suite
        run: |
          dotnet build -c Release --no-restore
          dotnet test -c Release --no-build --verbosity normal

      - name: Package Standalone & Framework-Dependent Binaries
        shell: pwsh
        run: |
          # Release tags use MAJOR.MINOR.PATCH (for example v2.1.0).
          # Legacy v1.2 update checks only recognize shorter tag names.
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          New-Item -ItemType Directory -Force -Path build/release/dist | Out-Null

          # 1. Standalone Self-Contained Single-File EXE (Zero .NET runtime install required)
          dotnet publish ScreenTask/ScreenTask.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false `
            -o build/release/standalone
          if ($LASTEXITCODE -ne 0) { throw "Standalone publish failed." }

          Copy-Item "build/release/standalone/ScreenTask.exe" "build/release/dist/ScreenTask-$tag-win-x64-standalone.exe"
          Copy-Item "build/release/standalone/DirectX-NOTICE.txt" "build/release/dist/DirectX-NOTICE.txt"
          Copy-Item "build/release/standalone/WebRTC-NOTICE.txt" "build/release/dist/WebRTC-NOTICE.txt"

          # 2. Lightweight Framework-Dependent Single-File ZIP (Requires .NET 9 Desktop Runtime)
          dotnet publish ScreenTask/ScreenTask.csproj -c Release -r win-x64 --self-contained false `
            -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false `
            -o build/release/fxdependent
          if ($LASTEXITCODE -ne 0) { throw "Framework-dependent publish failed." }

          Compress-Archive -Path "build/release/fxdependent/ScreenTask.exe", "build/release/fxdependent/DirectX-NOTICE.txt", "build/release/fxdependent/WebRTC-NOTICE.txt", "README.md" `
            -DestinationPath "build/release/dist/ScreenTask-$tag-win-x64-portable.zip" -Force

          # 3. Generate SHA-256 Checksums
          Push-Location build/release/dist
          $lines = @("ScreenTask-$tag-win-x64-standalone.exe", "ScreenTask-$tag-win-x64-portable.zip") | ForEach-Object {
            $hash = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $_"
          }
          [System.IO.File]::WriteAllLines((Join-Path $PWD "SHA256SUMS.txt"), $lines)
          Get-Content "SHA256SUMS.txt"
          Pop-Location

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTask-Release-Packages
          path: build/release/dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ScreenTask ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/release/dist/ScreenTask-*-win-x64-standalone.exe
            build/release/dist/ScreenTask-*-win-x64-portable.zip
            build/release/dist/SHA256SUMS.txt
            build/release/dist/DirectX-NOTICE.txt
            build/release/dist/WebRTC-NOTICE.txt
