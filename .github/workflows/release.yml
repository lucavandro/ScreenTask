name: Publish GitHub Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, Verify & Publish Release (.NET 9.0)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Prepare portable WebRTC runtime
        shell: pwsh
        run: ./scripts/Prepare-WebRtcRuntime.ps1

      - name: Verify JavaScript syntax (Web Viewer)
        run: |
          node -c ScreenTask/WebServer/viewer.js
          node --test ScreenTask.Tests/Web/viewer-decoder.test.cjs ScreenTask.Tests/Web/viewer-webrtc.test.cjs ScreenTask.Tests/Web/viewer-fullscreen.test.cjs

      - name: Build & Run Automated Test Suite
        run: |
          dotnet build -c Release --no-restore
          dotnet test -c Release --no-build --verbosity normal

      - name: Package Standalone & Framework-Dependent Binaries
        shell: pwsh
        run: |
          # Release tags use MAJOR.MINOR.PATCH (for example v2.1.0).
          # Legacy v1.2 update checks only recognize shorter tag names.
          $tag = if ($env:GITHUB_REF_NAME -like "v*") { $env:GITHUB_REF_NAME } else { "v2.0" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          # 1. Standalone Self-Contained Single-File EXE (Zero .NET runtime install required)
          dotnet publish ScreenTask/ScreenTask.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false `
            -o publish/standalone

          Copy-Item "publish/standalone/ScreenTask.exe" "dist/ScreenTask-$tag-win-x64-standalone.exe"
          Copy-Item "publish/standalone/DirectX-NOTICE.txt" "dist/DirectX-NOTICE.txt"
          Copy-Item "publish/standalone/WebRTC-NOTICE.txt" "dist/WebRTC-NOTICE.txt"

          # 2. Lightweight Framework-Dependent Single-File ZIP (Requires .NET 9 Desktop Runtime)
          dotnet publish ScreenTask/ScreenTask.csproj -c Release -r win-x64 --self-contained false `
            -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false `
            -o publish/fxdependent

          Compress-Archive -Path "publish/fxdependent/ScreenTask.exe", "publish/fxdependent/DirectX-NOTICE.txt", "publish/fxdependent/WebRTC-NOTICE.txt", "README.md" `
            -DestinationPath "dist/ScreenTask-$tag-win-x64-portable.zip" -Force

          # 3. Generate SHA-256 Checksums
          Push-Location dist
          $lines = @("ScreenTask-$tag-win-x64-standalone.exe", "ScreenTask-$tag-win-x64-portable.zip") | ForEach-Object {
            $hash = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $_"
          }
          [System.IO.File]::WriteAllLines((Join-Path $PWD "SHA256SUMS.txt"), $lines)
          Get-Content "SHA256SUMS.txt"
          Pop-Location

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTask-Release-Packages
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ScreenTask ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/ScreenTask-*-win-x64-standalone.exe
            dist/ScreenTask-*-win-x64-portable.zip
            dist/SHA256SUMS.txt
            dist/DirectX-NOTICE.txt
            dist/WebRTC-NOTICE.txt
